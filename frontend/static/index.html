<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Скачать видео с Ютуба</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");

            :root {
                --text-field-height: 2rem;
                --controls-height: 2.125rem;
                --controls-width: 7.5rem;
                --primary-color: #ff0033;
                --text-color: black;
                --disabled-button-color: rgba(0,0,0, 0.3);
            }

            body {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            * {
                font-family: Inter, sans-serif;
            }

            .mainVideoLinkInput-container {
                background: rgb(246, 246, 246);
                font-size:1.2rem;
                border-radius: 300px;
                display: flex;
                flex-direction: row;
                padding: 0.6rem;
                align-items: center;
            }


            #mainVideoLinkInput {
                border: none;
                font-size: inherit;
                outline: none;
                font-weight: 400;
                width: 100%;
                height: fit-content;
                background: transparent;
                white-space: nowrap;
                overflow-x: scroll;
                box-sizing: border-box;
            }

            .video-info {
                min-height: fit-content;
                display: flex;
                flex-direction: row;

                @media (width <= 600px) {
                    flex-direction: column;
                }
                gap: 1rem;
            }

            .video-and-input-container {
                width: 1000px;
                max-width: 100%;
            }

            #mainVideoLinkInput::placeholder {
                opacity: 30%;
                color: var(--text-color);
            }

            .video-title {
                margin-top: 0;
                margin-bottom: 0.25em;
                padding-top: 0;
                font-weight: 400;
                line-height: 2.5rem;
            }

            .video-author {
                margin-top: 0;
                margin-bottom: 0;
            }

            #videoInfoContainer {
                min-height: calc(50vh - var(--text-field-height));
                display: flex;
                flex-direction: column;
                justify-items: end;
                justify-content: flex-end;
            }

            .video-preview {
                height: 100%;
            }
            .video-preview-image {
                width: 100%;
                height: 100%;
            }
            .video-info-right-half {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: 2rem;
            }

            .download-controls {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                gap: 1.25rem;
            }
            .download-control {
                height: var(--controls-height);
                width: var(--controls-width);
                @media (width <= 600px) {
                    width: 100%;
                }
                font-size: 1rem;
                border: none;
            }


            .download-control, .skeleton{
                border-radius: 3px;
                @supports (corner-shape: squircle) {
                    corner-shape: squircle;
                    border-radius: 10px;
                }
            }

            select {
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;

                background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' stroke='black' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
                background-repeat: no-repeat;
                background-position: right 0.5em center;
                background-size: 2em auto;

                background-color: #efefef;
                padding-left: 0.5rem;
                padding-right: 0.5rem;
            }

            .download-button {
                background-color: var(--primary-color);
                color: white;
            }
            .video-title-link {
                text-decoration: none;
                color: var(--text-color);
            }



            .skeleton {
                background: #eee;
                height: 100%;
                animation: pulse 1.5s infinite;
                display:block;
                flex-grow: 1;
            }

            @keyframes pulse {
                0% { opacity: 1; }
                50% { opacity: 0.1; }
                100% { opacity: 1; }
            }

            #downloadButton, #pasteButton, #clearButton  {
                flex-direction: row;
                align-items: baseline;
                gap: 0.3em;
                padding:0.3em 0.5em;
                font-size: inherit;
                border-radius: 300px;
                border-width: 0;
            }

            #downloadButton {
                display:flex;
                color:white;
                background-color: var(--primary-color);
            }

            #downloadButton:disabled {
                background-color: transparent;
                border-color: var(--disabled-button-color);
                border-width: 1px;
                border-style: solid;
                color: var(--disabled-button-color);
            }

            #downloadButton:disabled #downloadButtonIcon path {
                fill: var(--disabled-button-color);
            }

            #downloadButtonIcon {
                font-size: inherit;
                height:0.6em;
                width:0.6em;
            }

            #linkInputControls {
                display:flex;
                flex-direction: row;
                gap: 0.5em
            }
        </style>
    </head>
    <body>
        <div class="video-and-input-container">
            <div id="videoInfoContainer">
            </div>
            <div class="mainVideoLinkInput-container" onclick="mainVideoLinkInput.focus()">
                <input
                    id="mainVideoLinkInput"
                    placeholder="Ссылка на видео"
                    type="url"
                    id="video-url-input"
                    autofocus
                />
                <div id="linkInputControls">
                    <div id="pasteButtonClearButtonArea">
                        <button id="pasteButton">Вставить</button>
                    </div>
                    <button id="downloadButton" disabled>
                        <span>Скачать</span>

                        <svg  viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" id="downloadButtonIcon">
                            <path d="M6.08751 0.912525C6.08751 0.408223 6.49572 0 7 0C7.50428 0 7.91249 0.408223 7.91249 0.912525V11.0751L12.4853 7.0743C12.8646 6.7424 13.4417 6.78007 13.7738 7.15901C14.1057 7.53833 14.068 8.11537 13.6891 8.44754L7.60189 13.7741C7.25763 14.0753 6.74237 14.0753 6.39811 13.7741L0.310882 8.44754C-0.0680404 8.11537 -0.105716 7.53833 0.226172 7.15901C0.558332 6.78007 1.13536 6.7424 1.51466 7.0743L6.08751 11.0751V0.912525Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </body>

    <script src="/script.js"></script>
</html>
