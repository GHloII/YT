<html>
    <meta charset="utf-8" />
    <title>QUnit</title>
    <link rel="stylesheet" href="../dependencies/qUnit/qunit-2.24.1.css" />
    <body>
        <div id="qunit"></div>
        <div id="qunit-fixture"></div>
        <script src="../dependencies/qUnit/qunit-2.24.1.js"></script>
        <script>
            QUnit.config.autostart = false;
        </script>
        <script src="../static/script.js"></script>
        <!-- <script src="your_app.test.js"></script> -->
        <script>
            QUnit.module("youtubeUrlTools", function () {
                QUnit.test("watch v", (assert) => {
                    assert.equal(
                        videoIdByYoutubeUrl(
                            "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
                        ),
                        "dQw4w9WgXcQ"
                    );
                });
                QUnit.test("video id in pathname", (assert) => {
                    assert.equal(
                        videoIdByYoutubeUrl("https://youtu.be/dQw4w9WgXcQ"),
                        "dQw4w9WgXcQ"
                    );
                });
                QUnit.test("video id in pathname with params", (assert) => {
                    assert.equal(
                        videoIdByYoutubeUrl(
                            "https://youtu.be/tk7qTNW5g0c?si=r3mtTefigXMjrzcy"
                        ),
                        "tk7qTNW5g0c"
                    );
                });
            });

            QUnit.start();
        </script>
    </body>
</html>
